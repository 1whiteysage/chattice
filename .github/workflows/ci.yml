name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets automation that cannot trigger `pull_request` runs (pull requests
  # opened with GITHUB_TOKEN) request the same checks for its branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/gen_sbom.py --check
      - run: uv run python scripts/sync_notices.py --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=chattice --cov-report=term-missing
      - run: uv run mypy src tests
      - run: uv run pip-audit
      - run: uv run mkdocs build --strict
      - run: uv run python -m compileall -q src tests examples
      - run: uv build
      - name: Inspect wheel contents
        run: |
          uv run python - <<'PY'
          import zipfile, sys
          wheel, = __import__("glob").glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          forbidden = ("docs/", "tests/", "examples/", "site/")
          bad = [n for n in names if any(k in n for k in forbidden)]
          assert not bad, f"wheel contains forbidden content: {bad}"
          assert any(n.endswith("dist-info/METADATA") for n in names)
          print(f"wheel inspection OK: {len(names)} files, no forbidden content")
          PY
      - run: bash scripts/verify_package.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run python scripts/gen_sbom.py --check
      - run: uv run pytest -q tests/test_documentation_examples.py
      - run: uv run ruff check examples/docs tests/test_documentation_examples.py
      - run: uv run ruff format --check examples/docs tests/test_documentation_examples.py
      - run: uv run python -m compileall -q examples/docs
      - run: uv run mkdocs build --strict
