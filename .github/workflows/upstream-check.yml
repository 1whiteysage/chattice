name: Google upstream watch

# Compares the reviewed baseline with the official Google Chat discovery
# document, release feed, and Python SDK releases. scripts/upstream_report.py
# names what changed (unwrapped methods, added/removed methods, scopes and
# schema fields, new release notes, SDK releases); that report is the body of
# one tracked issue. No dependency or source update is applied automatically.

on:
  schedule:
    - cron: "17 6 * * *" # Daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Report official Google changes since the reviewed baseline
        id: report
        run: |
          status=0
          # GitHub rejects issue bodies above 65536 characters.
          uv run python scripts/upstream_report.py \
            --save-discovery .discovery/chat-v1.json \
            --output .discovery/upstream-report.md \
            --max-chars 60000 || status=$?
          # 0: nothing to review. 1: review needed. Anything else, or a
          # missing report, means the monitor itself failed.
          if [ "$status" -gt 1 ] || [ ! -s .discovery/upstream-report.md ]; then
            echo "::error::scripts/upstream_report.py failed (exit $status)"
            exit 1
          fi
          echo "review=$status" >> "$GITHUB_OUTPUT"
          cat .discovery/upstream-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Sync the tracked issue with the report
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Google Chat upstream changed
          REVIEW: ${{ steps.report.outputs.review }}
        run: |
          gh label create upstream \
            --description "Official Google API or SDK change requiring review" \
            --color 0E8A16 \
            --force
          # Fetched and filtered in two commands so that a failing `gh` stops
          # the step instead of looking like "no tracked issue".
          issues="$(gh issue list --label upstream --state all --limit 100 \
            --json number,state,title)"
          tracked="$(jq -r --arg title "$ISSUE_TITLE" \
            'map(select(.title == $title)) | first | select(.) | "\(.number) \(.state)"' \
            <<<"$issues")"
          number="${tracked%% *}"
          state="${tracked##* }"

          if [ "$REVIEW" = "1" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file .discovery/upstream-report.md
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number"
              fi
            else
              gh issue create \
                --title "$ISSUE_TITLE" \
                --label upstream \
                --body-file .discovery/upstream-report.md
            fi
          elif [ -n "$number" ] && [ "$state" = "OPEN" ]; then
            gh issue comment "$number" \
              --body "The reviewed baseline now matches all monitored sources."
            gh issue close "$number"
          else
            echo "No upstream changes detected."
          fi
      - name: Verify operation registry against the discovery document
        run: |
          uv run python scripts/verify_registry.py .discovery/chat-v1.json
          # Non-zero exit opens the alert path used by this workflow.
